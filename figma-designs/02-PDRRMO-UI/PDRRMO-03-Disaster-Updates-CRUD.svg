<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="PDRRMO-Updates-CRUD-Bg" width="1440" height="900" fill="#F4F8FA"/>

  <!-- PDRRMO Sidebar -->
  <g id="PDRRMO-Sidebar">
    <rect width="260" height="900" fill="#EBF3F6" stroke="#C2D6E0"/>
    <g transform="translate(20, 20)">
      <circle cx="20" cy="20" r="20" fill="#033956" stroke="#008B9E" stroke-width="1.5"/>
      <text x="50" y="19" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="15" font-weight="800">SDN-NDIS</text>
      <text x="50" y="34" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="600">PDRRMO Operations</text>
    </g>
    <line x1="16" y1="74" x2="244" y2="74" stroke="#C2D6E0"/>
    <g transform="translate(14, 92)">
      <rect y="26" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="51" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Dashboard</text>
      <rect y="72" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="97" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Disasters</text>
      <rect y="118" width="232" height="40" rx="6" fill="#033956"/>
      <text x="40" y="143" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Disaster Updates</text>
      <rect y="164" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="189" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Disaster Types</text>
      <rect y="210" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="235" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Evacuation Centers</text>
      <rect y="256" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="281" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Municipalities</text>
      <rect y="302" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="327" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Access Logs</text>
    </g>
  </g>

  <!-- Main Content -->
  <g transform="translate(260, 0)">
    <rect width="1180" height="60" fill="#FFFFFF" stroke="#C2D6E0"/>
    <text x="32" y="35" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="14" font-weight="600">Disaster Updates</text>

    <g transform="translate(32, 84)">
      <text x="0" y="24" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="24" font-weight="800">Disaster Updates</text>
      <text x="0" y="46" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="13">Publish official emergency bulletins and situation updates for active disasters</text>
      <rect x="970" y="8" width="146" height="40" rx="6" fill="#007687"/>
      <text x="1043" y="33" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">+ New Update</text>
    </g>

    <!-- Table Card -->
    <g transform="translate(32, 156)">
      <rect width="630" height="680" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
      <rect x="20" y="20" width="260" height="38" rx="6" fill="#F4F8FA" stroke="#C2D6E0"/>
      <text x="36" y="44" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Search updates...</text>

      <rect x="1" y="76" width="628" height="40" fill="#E6F0F4"/>
      <text x="20" y="101" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Disaster</text>
      <text x="190" y="101" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Message</text>
      <text x="440" y="101" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Published At</text>
      <text x="550" y="101" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Actions</text>

      <g transform="translate(0, 116)">
        <line x1="0" y1="68" x2="630" y2="68" stroke="#E6F0F4"/>
        <text x="20" y="39" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="700">Tropical Storm Surge</text>
        <text x="190" y="39" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Pre-emptive evacuation ongoing...</text>
        <text x="440" y="39" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Oct 31, 4:30 PM</text>
        <rect x="548" y="18" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
        <text x="562" y="37" text-anchor="middle" fill="#032539" font-size="11">✎</text>
        <rect x="582" y="18" width="28" height="28" rx="6" fill="#DC2626"/>
        <text x="596" y="37" text-anchor="middle" fill="#FFFFFF" font-size="11">🗑</text>
      </g>
    </g>

    <!-- Modal Card -->
    <g transform="translate(682, 156)">
      <rect width="466" height="460" rx="12" fill="#FFFFFF" stroke="#007687" stroke-width="2"/>
      <text x="24" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="18" font-weight="800">Post Disaster Update Modal</text>
      <text x="24" y="56" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Publish an official advisory linked to a disaster incident</text>
      <line x1="0" y1="72" x2="466" y2="72" stroke="#C2D6E0"/>

      <g transform="translate(24, 90)">
        <text x="0" y="14" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Select Disaster Incident</text>
        <rect y="22" width="418" height="38" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
        <text x="14" y="46" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12">Tropical Storm Coastal Surge (Surigao City) ▾</text>

        <text x="0" y="84" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Published At</text>
        <rect y="92" width="418" height="38" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
        <text x="14" y="116" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12">2026-10-31 16:30</text>

        <text x="0" y="154" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Advisory Message</text>
        <rect y="162" width="418" height="110" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
        <text x="14" y="190" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12">All coastal vessels advised to remain in port.</text>

        <rect x="210" y="298" width="88" height="38" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
        <text x="254" y="322" text-anchor="middle" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Cancel</text>
        <rect x="308" y="298" width="110" height="38" rx="6" fill="#007687"/>
        <text x="363" y="322" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="700">Publish Update</text>
      </g>
    </g>
  </g>
</svg>

