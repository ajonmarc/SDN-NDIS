<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="PDRRMO-Dashboard-Bg" width="1440" height="960" fill="#F4F8FA"/>

  <!-- PDRRMO Sidebar (260px) -->
  <g id="PDRRMO-Sidebar">
    <rect width="260" height="960" fill="#EBF3F6" stroke="#C2D6E0"/>
    <g transform="translate(20, 20)">
      <circle cx="20" cy="20" r="20" fill="#033956" stroke="#008B9E" stroke-width="1.5"/>
      <path d="M20 10L27 13V19.5C27 24 24 28 20 29.5C16 28 13 24 13 19.5V13L20 10Z" fill="#F37F20"/>
      <text x="50" y="19" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="15" font-weight="800">SDN-NDIS</text>
      <text x="50" y="34" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="600">PDRRMO Operations</text>
    </g>
    <line x1="16" y1="74" x2="244" y2="74" stroke="#C2D6E0"/>

    <g transform="translate(14, 92)">
      <text x="10" y="14" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="10" font-weight="700">PDRRMO COMMAND MENU</text>
      <rect y="26" width="232" height="40" rx="6" fill="#033956"/>
      <text x="40" y="51" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Dashboard</text>
      <rect y="72" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="97" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="500">Disasters</text>
      <rect y="118" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="143" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="500">Disaster Updates</text>
      <rect y="164" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="189" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="500">Disaster Types</text>
      <rect y="210" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="235" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="500">Evacuation Centers</text>
      <rect y="256" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="281" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="500">Municipalities</text>
      <rect y="302" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="327" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="500">Access Logs</text>
    </g>
  </g>

  <!-- Main Workspace -->
  <g id="PDRRMO-Main" transform="translate(260, 0)">
    <rect width="1180" height="60" fill="#FFFFFF" stroke="#C2D6E0"/>
    <text x="32" y="35" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="14" font-weight="600">Dashboard</text>
    <rect x="1008" y="16" width="140" height="28" rx="14" fill="#DBEAFE"/>
    <text x="1078" y="34" text-anchor="middle" fill="#1D4ED8" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">ROLE: PDRRMO STAFF</text>

    <g transform="translate(32, 84)">
      <text x="0" y="24" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="24" font-weight="800">PDRRMO Operations Dashboard</text>
      <text x="0" y="46" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="400">Surigao del Norte natural disaster monitoring, evacuation capacity, and emergency advisories</text>
    </g>

    <!-- 4 KPI Cards -->
    <g id="PDRRMO-KPI-Row" transform="translate(32, 152)">
      <rect width="266" height="114" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
      <text x="20" y="32" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Active Disasters</text>
      <text x="20" y="68" fill="#DC2626" font-family="Oxanium, Inter, sans-serif" font-size="28" font-weight="800">1</text>
      <text x="20" y="94" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11">3 total recorded • 1 critical</text>

      <rect x="284" width="266" height="114" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
      <text x="304" y="32" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Open Evacuation Centers</text>
      <text x="304" y="68" fill="#16A34A" font-family="Oxanium, Inter, sans-serif" font-size="28" font-weight="800">4</text>
      <text x="304" y="94" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11">635 / 1,650 occupied (1,015 slots)</text>

      <rect x="568" width="266" height="114" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
      <text x="588" y="32" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Published Advisories</text>
      <text x="588" y="68" fill="#007687" font-family="Oxanium, Inter, sans-serif" font-size="28" font-weight="800">6</text>
      <text x="588" y="94" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11">Official emergency bulletins</text>

      <rect x="852" width="264" height="114" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
      <text x="872" y="32" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Municipalities &amp; Logs</text>
      <text x="872" y="68" fill="#033956" font-family="Oxanium, Inter, sans-serif" font-size="28" font-weight="800">21 LGUs</text>
      <text x="872" y="94" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11">8 disaster types • 48 access logs</text>
    </g>

    <!-- Recent Disasters & Evacuation Centers Grid -->
    <g transform="translate(32, 290)">
      <rect width="548" height="310" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
      <text x="24" y="34" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="16" font-weight="700">Recent Disasters</text>
      <text x="24" y="54" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Latest incident reports across Surigao del Norte</text>
      <rect x="1" y="70" width="546" height="36" fill="#E6F0F4"/>
      <text x="24" y="93" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Incident</text>
      <text x="230" y="93" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Municipality</text>
      <text x="360" y="93" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Severity</text>
      <text x="455" y="93" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Status</text>

      <g transform="translate(0, 106)">
        <line x1="0" y1="64" x2="548" y2="64" stroke="#E6F0F4"/>
        <text x="24" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Tropical Storm Surge</text>
        <text x="230" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Surigao City</text>
        <rect x="360" y="20" width="66" height="22" rx="4" fill="#DC2626"/>
        <text x="393" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="10" font-weight="700">Critical</text>
        <rect x="455" y="20" width="60" height="22" rx="4" fill="#DC2626"/>
        <text x="485" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="10" font-weight="700">Active</text>
      </g>

      <g transform="translate(0, 170)">
        <text x="24" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Highway Landslide</text>
        <text x="230" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Mainit</text>
        <rect x="360" y="20" width="66" height="22" rx="4" fill="#007687"/>
        <text x="393" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="10" font-weight="700">Moderate</text>
        <rect x="455" y="20" width="68" height="22" rx="4" fill="#E6F0F4"/>
        <text x="489" y="35" text-anchor="middle" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="10" font-weight="700">Resolved</text>
      </g>

      <!-- Evacuation Centers Card -->
      <g transform="translate(568, 0)">
        <rect width="548" height="310" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
        <text x="24" y="34" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="16" font-weight="700">Evacuation Centers Status</text>
        <text x="24" y="54" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Shelter capacity and current occupancy</text>
        <rect x="1" y="70" width="546" height="36" fill="#E6F0F4"/>
        <text x="24" y="93" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Center Name</text>
        <text x="250" y="93" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Municipality</text>
        <text x="370" y="93" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Occupancy</text>
        <text x="465" y="93" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Status</text>

        <g transform="translate(0, 106)">
          <line x1="0" y1="64" x2="548" y2="64" stroke="#E6F0F4"/>
          <text x="24" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Surigao City Provincial Gym</text>
          <text x="250" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Surigao City</text>
          <text x="370" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="700">180 / 500</text>
          <rect x="465" y="20" width="54" height="22" rx="4" fill="#007687"/>
          <text x="492" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="10" font-weight="700">Open</text>
        </g>

        <g transform="translate(0, 170)">
          <text x="24" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Dapa Municipal Evacuation</text>
          <text x="250" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Dapa</text>
          <text x="370" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="700">95 / 350</text>
          <rect x="465" y="20" width="54" height="22" rx="4" fill="#007687"/>
          <text x="492" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="10" font-weight="700">Open</text>
        </g>
      </g>
    </g>

    <!-- Recent Disaster Updates Full-Width Card -->
    <g transform="translate(32, 620)">
      <rect width="1116" height="304" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
      <text x="24" y="34" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="16" font-weight="700">Recent Disaster Updates &amp; Advisories</text>
      <rect x="1" y="54" width="1114" height="36" fill="#E6F0F4"/>
      <text x="24" y="77" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Disaster Incident</text>
      <text x="310" y="77" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Advisory Message</text>
      <text x="830" y="77" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Posted By</text>
      <text x="980" y="77" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Published At</text>

      <g transform="translate(0, 90)">
        <line x1="0" y1="64" x2="1116" y2="64" stroke="#E6F0F4"/>
        <text x="24" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Tropical Storm Coastal Surge</text>
        <text x="310" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Pre-emptive evacuation ordered for coastal barangays in Surigao City.</text>
        <text x="830" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Juan Dela Cruz</text>
        <text x="980" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Oct 31, 4:30 PM</text>
      </g>
    </g>
  </g>
</svg>

