<svg width="1440" height="860" viewBox="0 0 1440 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="860" fill="#F4F8FA"/>
  <!-- Sidebar -->
  <g id="PDRRMO-Sidebar">
    <rect width="260" height="860" fill="#EBF3F6" stroke="#C2D6E0"/>
    <g transform="translate(20, 20)">
      <circle cx="20" cy="20" r="20" fill="#033956" stroke="#008B9E" stroke-width="1.5"/>
      <text x="50" y="19" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="15" font-weight="800">SDN-NDIS</text>
      <text x="50" y="34" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="600">PDRRMO Operations</text>
    </g>
    <line x1="16" y1="74" x2="244" y2="74" stroke="#C2D6E0"/>
    <g transform="translate(14, 92)">
      <rect y="26" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="51" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Dashboard</text>
      <rect y="72" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="97" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Disasters</text>
      <rect y="118" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="143" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Disaster Updates</text>
      <rect y="164" width="232" height="40" rx="6" fill="#033956"/>
      <text x="40" y="189" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Disaster Types</text>
      <rect y="210" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="235" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Evacuation Centers</text>
      <rect y="256" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="281" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Municipalities</text>
      <rect y="302" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="327" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Access Logs</text>
    </g>
  </g>

  <g transform="translate(260, 0)">
    <rect width="1180" height="60" fill="#FFFFFF" stroke="#C2D6E0"/>
    <text x="32" y="35" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="14" font-weight="600">Disaster Types</text>

    <g transform="translate(32, 84)">
      <text x="0" y="24" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="24" font-weight="800">Disaster Types</text>
      <text x="0" y="46" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="13">Manage natural hazard classifications (Typhoon, Earthquake, Flood, Landslide, Storm Surge)</text>
      <rect x="956" y="8" width="160" height="40" rx="6" fill="#007687"/>
      <text x="1036" y="33" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">+ New Disaster Type</text>
    </g>

    <g transform="translate(32, 156)">
      <rect width="640" height="640" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
      <rect x="1" y="64" width="638" height="40" fill="#E6F0F4"/>
      <text x="20" y="89" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">ID</text>
      <text x="70" y="89" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Type Name ↕</text>
      <text x="230" y="89" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Description</text>
      <text x="550" y="89" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Actions</text>

      <g transform="translate(0, 104)">
        <line x1="0" y1="60" x2="640" y2="60" stroke="#E6F0F4"/>
        <text x="20" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">1</text>
        <text x="70" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Typhoon</text>
        <text x="230" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Tropical cyclones, destructive winds &amp; rain</text>
      </g>
      <g transform="translate(0, 164)">
        <line x1="0" y1="60" x2="640" y2="60" stroke="#E6F0F4"/>
        <text x="20" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">2</text>
        <text x="70" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Flood</text>
        <text x="230" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">River overflow &amp; low-lying flash floods</text>
      </g>
      <g transform="translate(0, 224)">
        <line x1="0" y1="60" x2="640" y2="60" stroke="#E6F0F4"/>
        <text x="20" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">3</text>
        <text x="70" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Earthquake</text>
        <text x="230" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Seismic ground shaking along Philippine Trench</text>
      </g>
      <g transform="translate(0, 284)">
        <text x="20" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">4</text>
        <text x="70" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Landslide</text>
        <text x="230" y="36" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Rain-induced or seismic slope failure</text>
      </g>
    </g>

    <!-- Modal -->
    <g transform="translate(692, 156)">
      <rect width="456" height="390" rx="12" fill="#FFFFFF" stroke="#007687" stroke-width="2"/>
      <text x="24" y="36" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="18" font-weight="800">Disaster Type Modal</text>
      <line x1="0" y1="62" x2="456" y2="62" stroke="#C2D6E0"/>
      <g transform="translate(24, 82)">
        <text x="0" y="14" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Type Name</text>
        <rect y="22" width="408" height="38" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
        <text x="14" y="46" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12">Storm Surge</text>
        <text x="0" y="84" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Description</text>
        <rect y="92" width="408" height="100" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
        <text x="14" y="118" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12">Abnormal coastal sea-level rise during typhoons.</text>
        <rect x="298" y="218" width="110" height="38" rx="6" fill="#007687"/>
        <text x="353" y="242" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="700">Save Type</text>
      </g>
    </g>
  </g>
</svg>

