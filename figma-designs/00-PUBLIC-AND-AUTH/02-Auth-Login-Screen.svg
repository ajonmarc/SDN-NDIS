<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leftPanelGrad" x1="0" y1="0" x2="840" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#021824"/>
      <stop offset="50%" stop-color="#033956"/>
      <stop offset="100%" stop-color="#00606F"/>
    </linearGradient>
    <linearGradient id="cardTopBar" x1="926" y1="168" x2="1374" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#033956"/>
      <stop offset="50%" stop-color="#007687"/>
      <stop offset="100%" stop-color="#F37F20"/>
    </linearGradient>
  </defs>

  <rect id="Screen-Background" width="1440" height="900" fill="#F4F8FA"/>

  <g id="Left-Brand-Showcase-Panel">
    <rect width="840" height="900" fill="url(#leftPanelGrad)"/>
    <g transform="translate(48, 40)">
      <circle cx="24" cy="24" r="24" fill="#008B9E" stroke="#38E0F5" stroke-width="2"/>
      <path d="M24 14L31 17V23C31 27.5 28 31.5 24 33C20 31.5 17 27.5 17 23V17L24 14Z" fill="#F37F20"/>
      <text x="60" y="22" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="18" font-weight="700">SDN-NDIS</text>
      <text x="60" y="40" fill="#A5F3FC" font-family="Oxanium, Inter, sans-serif" font-size="12">Province of Surigao del Norte</text>
    </g>

    <g transform="translate(48, 190)">
      <text x="0" y="36" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="36" font-weight="800">Surigao del Norte Natural Disaster</text>
      <text x="0" y="80" fill="#38E0F5" font-family="Oxanium, Inter, sans-serif" font-size="36" font-weight="800">Information System</text>
      <text x="0" y="120" fill="#E2E8F0" font-family="Oxanium, Inter, sans-serif" font-size="15">Unified web-based disaster monitoring, evacuation center management,</text>
      <text x="0" y="142" fill="#E2E8F0" font-family="Oxanium, Inter, sans-serif" font-size="15">and public advisory platform for resilient communities.</text>
    </g>
  </g>

  <g id="Right-Auth-Form-Panel">
    <rect x="926" y="168" width="448" height="580" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
    <rect x="926" y="168" width="448" height="6" rx="3" fill="url(#cardTopBar)"/>

    <g transform="translate(958, 200)">
      <circle cx="192" cy="32" r="32" fill="#033956"/>
      <text x="192" y="92" text-anchor="middle" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="22" font-weight="700">Sign in to SDN-NDIS</text>
      <text x="192" y="114" text-anchor="middle" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="13">Enter your credentials to access your disaster management portal</text>
    </g>

    <g transform="translate(958, 344)">
      <text x="0" y="14" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="600">Email Address</text>
      <rect x="0" y="24" width="384" height="40" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
      <text x="14" y="49" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="13">name@example.com</text>

      <g transform="translate(0, 84)">
        <text x="0" y="14" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="600">Password</text>
        <text x="384" y="14" text-anchor="end" fill="#007687" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="500">Forgot password?</text>
        <rect x="0" y="24" width="384" height="40" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
        <text x="14" y="49" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="13">Enter your password</text>
      </g>

      <g transform="translate(0, 208)">
        <rect width="384" height="44" rx="6" fill="#007687"/>
        <text x="192" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="14" font-weight="700">Sign In</text>
      </g>
    </g>
  </g>
</svg>

