<svg width="1440" height="920" viewBox="0 0 1440 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="GUEST-Disasters-Bg" width="1440" height="920" fill="#F4F8FA"/>

  <!-- GUEST Sidebar -->
  <g id="GUEST-Sidebar">
    <rect width="260" height="920" fill="#EBF3F6" stroke="#C2D6E0"/>
    <g transform="translate(20, 20)">
      <circle cx="20" cy="20" r="20" fill="#033956" stroke="#008B9E" stroke-width="1.5"/>
      <text x="50" y="19" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="15" font-weight="800">SDN-NDIS</text>
      <text x="50" y="34" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="600">Citizen &amp; Guest Portal</text>
    </g>
    <line x1="16" y1="74" x2="244" y2="74" stroke="#C2D6E0"/>
    <g transform="translate(14, 92)">
      <rect y="26" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="51" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Guest Dashboard</text>
      <rect y="72" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="97" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Disaster &amp; Evacuation Map</text>
      <rect y="118" width="232" height="40" rx="6" fill="#033956"/>
      <text x="40" y="143" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Disasters &amp; Updates</text>
      <rect y="164" width="232" height="40" rx="6" fill="#EBF3F6"/>
      <text x="40" y="189" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Evacuation Centers</text>
    </g>
  </g>

  <!-- Main Workspace -->
  <g transform="translate(260, 0)">
    <rect width="1180" height="60" fill="#FFFFFF" stroke="#C2D6E0"/>
    <text x="32" y="35" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="14" font-weight="600">Disasters &amp; Updates</text>

    <g transform="translate(32, 84)">
      <text x="0" y="24" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="24" font-weight="800">Disasters &amp; Official Updates</text>
      <text x="0" y="46" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="13">Browse reported disasters, severity alerts, and verified PDRRMO situation bulletins</text>
    </g>

    <!-- Search & Filter Bar Card -->
    <g transform="translate(32, 152)">
      <rect width="1116" height="72" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
      <rect x="18" y="16" width="340" height="40" rx="6" fill="#F4F8FA" stroke="#C2D6E0"/>
      <text x="36" y="41" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Search title, municipality, or advisory...</text>

      <rect x="374" y="16" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
      <text x="390" y="41" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12">All Municipalities (21) ▾</text>

      <rect x="610" y="16" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
      <text x="626" y="41" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12">All Disaster Types ▾</text>

      <rect x="826" y="16" width="170" height="40" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
      <text x="842" y="41" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12">All Statuses ▾</text>

      <rect x="1012" y="16" width="86" height="40" rx="6" fill="#E6F0F4"/>
      <text x="1055" y="41" text-anchor="middle" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Reset</text>
    </g>

    <!-- Disaster Cards Grid (2 Columns) -->
    <g transform="translate(32, 246)">
      <!-- Card 1 -->
      <g id="Guest-Disaster-Card-1">
        <rect width="546" height="410" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
        <rect x="24" y="24" width="68" height="24" rx="4" fill="#DC2626"/>
        <text x="58" y="40" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Critical</text>
        <rect x="100" y="24" width="60" height="24" rx="4" fill="#FEF3C7"/>
        <text x="130" y="40" text-anchor="middle" fill="#D97706" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Active</text>
        <rect x="168" y="24" width="76" height="24" rx="4" fill="#E6F0F4"/>
        <text x="206" y="40" text-anchor="middle" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="600">Typhoon</text>

        <text x="24" y="78" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="18" font-weight="800">Tropical Storm Coastal Surge</text>
        <text x="24" y="100" fill="#007687" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="700">Surigao City • Occurred Oct 31, 2026</text>
        <text x="24" y="128" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Pre-emptive evacuation ordered for coastal barangays in Surigao City.</text>

        <line x1="24" y1="152" x2="522" y2="152" stroke="#E6F0F4"/>
        <text x="24" y="178" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Latest Official Bulletins (2)</text>

        <rect x="24" y="192" width="498" height="72" rx="8" fill="#F4F8FA" stroke="#C2D6E0"/>
        <text x="38" y="216" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">All coastal vessels advised to remain in port; Surigao City Gym open.</text>
        <text x="38" y="242" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11">Posted by PDRRMO • Oct 31, 4:30 PM</text>

        <rect x="24" y="276" width="498" height="60" rx="8" fill="#F4F8FA" stroke="#C2D6E0"/>
        <text x="38" y="300" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">Medical standby teams deployed across designated shelters.</text>
        <text x="38" y="322" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11">Posted by PDRRMO • Oct 31, 2:10 PM</text>

        <rect x="24" y="354" width="144" height="36" rx="6" fill="#007687"/>
        <text x="96" y="377" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="700">View Full Timeline</text>
        <rect x="180" y="354" width="134" height="36" rx="6" fill="#FFFFFF" stroke="#C2D6E0"/>
        <text x="247" y="377" text-anchor="middle" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">View on GIS Map</text>
      </g>

      <!-- Card 2 -->
      <g id="Guest-Disaster-Card-2" transform="translate(570, 0)">
        <rect width="546" height="410" rx="10" fill="#FFFFFF" stroke="#C2D6E0"/>
        <rect x="24" y="24" width="74" height="24" rx="4" fill="#007687"/>
        <text x="61" y="40" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Moderate</text>
        <rect x="106" y="24" width="72" height="24" rx="4" fill="#DCFCE7"/>
        <text x="142" y="40" text-anchor="middle" fill="#15803D" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="700">Resolved</text>
        <rect x="186" y="24" width="80" height="24" rx="4" fill="#E6F0F4"/>
        <text x="226" y="40" text-anchor="middle" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="11" font-weight="600">Landslide</text>

        <text x="24" y="78" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="18" font-weight="800">Highway Slope Landslide</text>
        <text x="24" y="100" fill="#007687" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="700">Mainit • Occurred Oct 28, 2026</text>
        <text x="24" y="128" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="12">Cleared debris along national highway in Mainit; all lanes passable.</text>

        <line x1="24" y1="152" x2="522" y2="152" stroke="#E6F0F4"/>
        <text x="24" y="178" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Latest Official Bulletins (1)</text>

        <rect x="24" y="192" width="498" height="72" rx="8" fill="#F4F8FA" stroke="#C2D6E0"/>
        <text x="38" y="216" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="600">DPWH and PDRRMO clearing teams have reopened both lanes to traffic.</text>
        <text x="38" y="242" fill="#3B5C6E" font-family="Oxanium, Inter, sans-serif" font-size="11">Posted by PDRRMO • Oct 29, 9:00 AM</text>

        <rect x="24" y="354" width="144" height="36" rx="6" fill="#007687"/>
        <text x="96" y="377" text-anchor="middle" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="12" font-weight="700">View Full Timeline</text>
      </g>
    </g>
  </g>
</svg>

