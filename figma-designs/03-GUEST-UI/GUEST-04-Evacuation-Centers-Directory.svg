      <text x="40" y="143" fill="#032539" font-family="Oxanium, Inter, sans-serif" font-size="13">Disasters &amp; Updates</text>
      <rect y="164" width="232" height="40" rx="6" fill="#033956"/>
      <text x="40" y="189" fill="#FFFFFF" font-family="Oxanium, Inter, sans-serif" font-size="13" font-weight="700">Evacuation Centers</text>
